<html>
    <head>
        <title>Float in HTML</title>
        <style>
            img#flowerRight {
                float: right;
            }

            img#flowerLeft {
                float: left;
            }

        </style>
    </head>
    <body>
        <h2>Float Right</h2>
        <p>In this example, the image will float to the right of the paragraph,
            and the text in the paragraph will wrap around the image.
        </p>
        <p>
            <img id="flowerRight" src="bruno.html" alt="tree"
            style="width: 100px; height: 100px;">
            <img id="flowerLeft" src="sesko.html" alt="tree"
            style="width: 100px; height: 100px;">

            This is a dummy content used to understand float properly
        </p>
    </body>
</html>
