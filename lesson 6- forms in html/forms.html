<html>
    <head>
        <title>Forms in HTML</title>
    </head>
    <body>
        <form>
            <label>Name</label><br>
            <input type="text" id="name"><br><br>
            <label>Email ID</label><br>
            <input type="text" id="email"><br><br>
            <label>Mobile Number (this will be hidden)</label>
            <input type="password" id="mobile"><br><br>
            <label>Gender</label>
            <input type="radio" id="female" name="gender" value="Female">Female<br>
            <input type="radio" id="male" name="gender" value="male">Male<br><br>
            <label>Favourite city</label>
            <input type="checkbox" id="city" value="London">London<br>
            <input type="checkbox" id="city" value="Preston">Preston<br><br>
            <input type="submit">
        </form>
    </body>
</html>
